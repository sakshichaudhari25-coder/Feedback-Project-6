<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes Saver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📝 Quick Notes Saver</h1>
        <p class="subTitle">Save your Important Notes Quickly</p>

        <form id="noteForm">
            <label for="title">Note Title</lable>
            <input 
            type="text"
            id="title"
            placeholder="Enter note title" 
            required>
            <br/>

            <label for="content">Note Content</label>
            <textarea
            id="content"
            placeholder="write your notes here"
            required></textarea>
<br/>

        <button type="submit">
            Save Note
        </button>
        </form>
    </div>

    <a href="notes.html">Notes Page</a>
    <script src="script.js"></script>
    
</body>
</html>
